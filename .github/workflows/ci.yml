name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      - name: Check formatting with black
        run: black --check ekko.py

      - name: Lint with flake8
        run: flake8 ekko.py --max-line-length=100 --ignore=E501,W503

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pexpect

      - name: Run basic tests
        run: |
          python3 ekko.py --help
          python3 ekko.py --version

      - name: Run setup wizard tests
        run: python3 tests/test_setup_wizard.py

      - name: Run installation tests
        run: python3 tests/test_piped_installation.py

      - name: Run provider switching tests
        run: python3 tests/test_provider_switching.py

      - name: Run upgrade compatibility tests
        run: python3 tests/test_upgrade_compatibility.py

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test installation script
        run: |
          # Test that the installer runs without errors
          bash install-ekko.sh < /dev/null || echo "Installer requires interactive input (expected)"

      - name: Verify ekko is executable
        run: |
          chmod +x ekko.py
          ./ekko.py --help
          ./ekko.py --version

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
