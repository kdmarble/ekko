name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      - name: Check formatting with black
        run: black --check ekko_package/ekko/*.py ekko_package/ekko/providers/*.py || echo "⚠️ Black formatting suggestions found (non-blocking)"
        continue-on-error: true

      - name: Lint with flake8
        run: flake8 ekko_package/ekko/*.py ekko_package/ekko/providers/*.py --max-line-length=100 --ignore=E501,W503

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pexpect typer

      - name: Install ekko package
        run: |
          cd ekko_package
          pip install -e .

      - name: Run basic tests
        run: |
          python3 -m ekko.cli --help
          python3 -m ekko.cli --version

      - name: Run setup wizard tests
        run: python3 tests/test_setup_wizard.py

      - name: Run provider switching tests
        run: python3 tests/test_provider_switching.py

      - name: Run upgrade compatibility tests
        run: python3 tests/test_upgrade_compatibility.py

      - name: Run installation tests (disabled)
        run: python3 tests/test_piped_installation.py

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests typer

      - name: Install ekko package
        run: |
          cd ekko_package
          pip install .

      - name: Test CLI commands
        run: |
          ekko --help
          ekko --version

      - name: Test package build
        run: |
          pip install build
          cd ekko_package
          python3 -m build

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
