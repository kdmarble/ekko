name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run tests
        run: |
          python3 ekko.py --help
          python3 ekko.py --version
          pip install pexpect
          python3 tests/test_setup_wizard.py
          python3 tests/test_piped_installation.py
          python3 tests/test_provider_switching.py
          python3 tests/test_upgrade_compatibility.py

      - name: Create release archive
        run: |
          mkdir -p release
          cp ekko.py release/
          cp install-ekko.sh release/
          cp README.md release/
          cp LICENSE release/
          cp CHANGELOG.md release/
          cd release
          tar -czf ekko-${GITHUB_REF_NAME}.tar.gz *

      - name: Generate checksums
        run: |
          cd release
          sha256sum ekko-${GITHUB_REF_NAME}.tar.gz > checksums.txt
          sha256sum ekko.py >> checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release/

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the section for this version from CHANGELOG.md
          VERSION=${GITHUB_REF_NAME#v}
          awk -v version="$VERSION" '
            /^## \['"$VERSION"'\]/ { flag=1; next }
            /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_file: release-notes.md
          files: |
            release/ekko-*.tar.gz
            release/checksums.txt
            release/ekko.py
            release/install-ekko.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  announce:
    name: Post-Release Tasks
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release announcement
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "🎉 ekko v$VERSION has been released!"
          echo ""
          echo "Install or upgrade with:"
          echo "curl -fsSL https://raw.githubusercontent.com/kdmarble/ekko/main/install-ekko.sh | bash"
          echo ""
          echo "See the changelog: https://github.com/kdmarble/ekko/blob/main/CHANGELOG.md"
