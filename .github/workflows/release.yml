name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.3.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for setuptools_scm to access git tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ekko_package/pyproject.toml'

      - name: Set version variables
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create tag for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="${{ steps.version.outputs.TAG_NAME }}"
          # Check if tag exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists"
            git checkout "$TAG_NAME"
          else
            echo "Creating tag $TAG_NAME"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # Quick smoke test only - full tests already passed in CI
      - name: Verify package can be imported
        run: |
          pip install -e ekko_package
          python3 -c "import ekko; print(f'ekko version: {ekko.__version__}')"
          python3 -m ekko.cli --help
          python3 -m ekko.cli --version

      - name: Build package distribution
        run: |
          python3 -m build ekko_package

      - name: Create release archives
        run: |
          TAG_NAME="${{ steps.version.outputs.TAG_NAME }}"
          mkdir -p release
          # Package wheels and source
          cp ekko_package/dist/*.whl release/ || true
          cp ekko_package/dist/*.tar.gz release/ || true
          # Installation script and docs
          cp install-ekko.sh release/
          cp README.md release/
          cp LICENSE release/
          cp CHANGELOG.md release/
          cp CONTRIBUTING.md release/
          # Create combined archive
          cd release
          tar -czf ekko-${TAG_NAME}.tar.gz install-ekko.sh README.md LICENSE CHANGELOG.md CONTRIBUTING.md

      - name: Generate checksums
        run: |
          TAG_NAME="${{ steps.version.outputs.TAG_NAME }}"
          cd release
          sha256sum ekko-${TAG_NAME}.tar.gz > checksums.txt
          sha256sum *.whl >> checksums.txt || true
          sha256sum install-ekko.sh >> checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for accessing git tags and history

      - name: Set version variables
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release/

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the section for this version from CHANGELOG.md
          VERSION="${{ steps.version.outputs.VERSION }}"
          awk -v version="$VERSION" '
            /^## \['"$VERSION"'\]/ { flag=1; next }
            /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md

          # Check if we got any content
          if [ -s release-notes.md ]; then
            echo "has_changelog=true" >> $GITHUB_OUTPUT
            echo "✅ Found changelog entry for version $VERSION"
          else
            echo "has_changelog=false" >> $GITHUB_OUTPUT
            echo "⚠️  No changelog entry found for version $VERSION"
            echo "Will use GitHub's automatic release notes generation"
          fi

      - name: Create GitHub Release (with changelog)
        if: steps.changelog.outputs.has_changelog == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          body_path: release-notes.md
          files: |
            release/ekko-*.tar.gz
            release/ekko-*.whl
            release/checksums.txt
            release/install-ekko.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (auto-generated)
        if: steps.changelog.outputs.has_changelog == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          generate_release_notes: true
          files: |
            release/ekko-*.tar.gz
            release/ekko-*.whl
            release/checksums.txt
            release/install-ekko.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  announce:
    name: Post-Release Tasks
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for accessing git tags and history

      - name: Set version variables
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create release announcement
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG_NAME="${{ steps.version.outputs.TAG_NAME }}"
          echo "🎉 ekko v$VERSION has been released!"
          echo ""
          echo "Install or upgrade with:"
          echo "curl -fsSL https://raw.githubusercontent.com/kdmarble/ekko/main/install-ekko.sh | bash"
          echo ""
          echo "Or use pipx directly:"
          echo "pipx install git+https://github.com/kdmarble/ekko.git@${TAG_NAME}"
          echo ""
          echo "See the changelog: https://github.com/kdmarble/ekko/blob/main/CHANGELOG.md"
