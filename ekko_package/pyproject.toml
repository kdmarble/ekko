[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ekko"
version = "1.2.0"
description = "AI-powered command line assistant"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "kdmarble"}
]
keywords = ["cli", "ai", "llm", "command-line", "assistant", "anthropic", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/kdmarble/ekko"
Repository = "https://github.com/kdmarble/ekko"
"Bug Tracker" = "https://github.com/kdmarble/ekko/issues"

[project.scripts]
ekko = "ekko.cli:main"

[tool.setuptools]
packages = ["ekko", "ekko.providers"]

[tool.setuptools.package-data]
ekko = ["py.typed"]
