name: CI
permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Skip on main if this is a merge commit from a PR (already tested)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Merge pull request')
    strategy:
      fail-fast: false
      matrix:
        # Full matrix on PRs, minimal on main/develop
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.9", "3.10", "3.11", "3.12"]') || fromJSON('["3.11", "3.12"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for setuptools_scm to access git tags

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: 'ekko_package/pyproject.toml'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ekko_package/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ekko_package[dev]

      - name: Run tests with pytest
        run: |
          cd ekko_package
          pytest ../tests/ -v --tb=short --disable-warnings

      - name: Test CLI integration
        run: |
          ekko --help
          ekko --version

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    # Only run on PRs and direct pushes (not PR merges)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Merge pull request')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for setuptools_scm to access git tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache ruff
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-ruff-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-ruff-

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting with ruff
        run: ruff format --check ekko_package/ekko/*.py ekko_package/ekko/providers/*.py

      - name: Lint with ruff
        run: ruff check ekko_package/ekko/*.py ekko_package/ekko/providers/*.py

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # Run on PRs and weekly on main (via schedule, if configured)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for setuptools_scm to access git tags

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
