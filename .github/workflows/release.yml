name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.3.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Install ekko package for testing
        run: |
          pip install -e ekko_package[dev]

      - name: Run tests
        run: |
          python3 -m ekko.cli --help
          python3 -m ekko.cli --version
          pytest tests/ -v --tb=short --disable-warnings

      - name: Build package distribution
        run: |
          cd ekko_package
          python3 -m build
          cd ..

      - name: Create release archives
        run: |
          mkdir -p release
          # Package wheels and source
          cp ekko_package/dist/*.whl release/ || true
          cp ekko_package/dist/*.tar.gz release/ || true
          # Installation script and docs
          cp install-ekko.sh release/
          cp README.md release/
          cp LICENSE release/
          cp CHANGELOG.md release/
          cp CONTRIBUTING.md release/
          # Create combined archive
          cd release
          tar -czf ekko-${GITHUB_REF_NAME}.tar.gz install-ekko.sh README.md LICENSE CHANGELOG.md CONTRIBUTING.md

      - name: Generate checksums
        run: |
          cd release
          sha256sum ekko-${GITHUB_REF_NAME}.tar.gz > checksums.txt
          sha256sum *.whl >> checksums.txt || true
          sha256sum install-ekko.sh >> checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release/

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the section for this version from CHANGELOG.md
          VERSION=${GITHUB_REF_NAME#v}
          awk -v version="$VERSION" '
            /^## \['"$VERSION"'\]/ { flag=1; next }
            /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_file: release-notes.md
          files: |
            release/ekko-*.tar.gz
            release/ekko-*.whl
            release/checksums.txt
            release/install-ekko.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  announce:
    name: Post-Release Tasks
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release announcement
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "🎉 ekko v$VERSION has been released!"
          echo ""
          echo "Install or upgrade with:"
          echo "curl -fsSL https://raw.githubusercontent.com/kdmarble/ekko/main/install-ekko.sh | bash"
          echo ""
          echo "Or use pipx directly:"
          echo "pipx install git+https://github.com/kdmarble/ekko.git@${GITHUB_REF_NAME}"
          echo ""
          echo "See the changelog: https://github.com/kdmarble/ekko/blob/main/CHANGELOG.md"
